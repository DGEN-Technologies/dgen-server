name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flag sensitive file changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          SENSITIVE_FILES="lib/db.ts lib/auth.ts config.ts"
          CHANGED=$(git diff --name-only origin/$BASE_REF...HEAD)
          for file in $SENSITIVE_FILES; do
            if echo "$CHANGED" | grep -q "^$file$"; then
              echo "::warning file=$file::⚠️ SENSITIVE FILE MODIFIED - requires careful review"
            fi
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
